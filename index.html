<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agrim's Birthday Starter Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Caveat:wght@500;700&family=Playfair+Display:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4ecdc;--paper:#fbf6ea;--red:#8b1e1e;--ink:#3a1a14;--pink:#e9a6b8;--gold:#b8892a;--tape:rgba(217,183,126,.85)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Playfair Display',serif;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(rgba(139,30,30,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(139,30,30,.07) 1px,transparent 1px);background-size:22px 22px;overflow-x:hidden;min-height:100vh}
.gingham{height:24px;background-color:var(--cream);background-image:linear-gradient(90deg,rgba(139,30,30,.6) 50%,transparent 50%),linear-gradient(rgba(139,30,30,.6) 50%,transparent 50%);background-size:24px 24px}
main{max-width:440px;margin:0 auto;padding:26px 20px 50px;text-align:center}
.hand{font-family:'Caveat',cursive}
.kicker{font-size:28px;color:var(--red);transform:rotate(-3deg);display:inline-block}
.cutout{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;margin:8px 0 4px}
.word{display:inline-flex;gap:3px;flex-wrap:nowrap}
.word span{display:inline-block;padding:2px 6px;line-height:1.1;box-shadow:1px 2px 0 rgba(0,0,0,.18)}

.bag{position:relative;width:min(300px,84vw);height:320px;margin:26px auto 12px;border-radius:16px;background:rgba(255,255,255,.5);border:2px solid rgba(150,160,170,.55);box-shadow:inset 0 0 34px rgba(255,255,255,.95),0 10px 22px rgba(58,26,20,.15);transform:rotate(-3deg);overflow:hidden;cursor:pointer}
.bag::after{content:'';position:absolute;top:-40%;left:-40%;width:40%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:rotate(20deg);animation:shine 3.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,60%{left:-40%}100%{left:130%}}
.zip{position:absolute;left:12px;right:12px;top:20px;height:18px;z-index:3}
.teeth{position:absolute;left:0;right:0;top:5px;height:8px;background:repeating-linear-gradient(90deg,#9aa4ad 0 3px,transparent 3px 6px);border-radius:4px}
.opened{position:absolute;left:0;top:3px;height:12px;width:0;background:var(--ink);border-radius:6px;opacity:.8}
.tab{position:absolute;left:0;top:-9px;width:36px;height:36px;border-radius:10px;background:var(--red);box-shadow:0 3px 6px rgba(0,0,0,.3);touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center}
.tab::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--paper)}
.ghost{position:absolute;filter:blur(2.5px);opacity:.5}
.gp{top:62px;left:34px;width:130px;height:165px;background:#1d2b3a;outline:10px solid #fff;transform:rotate(-7deg)}
.gt{left:120px;width:150px;height:62px;background:var(--cream);border-left:14px solid var(--red)}
.gt1{top:150px;transform:rotate(9deg)}.gt2{top:212px;transform:rotate(-4deg)}
.label{position:absolute;bottom:16px;left:16px;z-index:2;background:var(--cream);border:1.5px dashed var(--red);padding:6px 10px;font-family:'Caveat',cursive;font-size:19px;line-height:1.1;transform:rotate(-5deg);text-align:left}
.label small{font-size:15px;color:var(--red)}
.hint{font-size:24px;color:var(--red);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(8px)}}
.bag.gone{animation:away .7s ease-in forwards}
@keyframes away{to{transform:translateY(60px) rotate(12deg) scale(.5);opacity:0}}

.pop{opacity:0;transform:translateY(24px) scale(.96);animation:pop .7s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.polaroid{position:relative;background:#fff;padding:12px 12px 52px;width:min(280px,80vw);margin:22px auto 8px;box-shadow:0 8px 20px rgba(58,26,20,.2)}
.polaroid.pop{animation-name:popTilt}
@keyframes popTilt{to{opacity:1;transform:rotate(2.5deg)}}
.polaroid img{width:100%;display:block}
.cap{position:absolute;left:0;right:0;bottom:8px;font-size:30px}
.cap u{text-decoration-color:var(--red);text-decoration-thickness:3px}
.tape{position:absolute;top:-13px;left:50%;width:96px;height:28px;background:var(--tape);transform:translateX(-50%) rotate(-5deg);z-index:2}
.sub{font-family:'Special Elite',monospace;font-size:14px;margin:16px 0 4px}
.section{margin-top:38px}

.ticket{perspective:1200px;height:178px;margin:18px 0;cursor:pointer}
.t-a{transform:rotate(-1.5deg)}.t-b{transform:rotate(1.5deg)}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
.ticket.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;overflow:hidden;box-shadow:0 5px 14px rgba(58,26,20,.18)}
.front{display:flex;background:var(--cream);text-align:left}
.front::before,.front::after{content:'';position:absolute;right:83px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.front::before{top:-9px}.front::after{bottom:-9px}
.check{width:20px;flex:none;background-color:#b3202a;background-image:linear-gradient(90deg,rgba(0,0,0,.5) 50%,transparent 50%),linear-gradient(rgba(0,0,0,.5) 50%,transparent 50%);background-size:12px 12px}
.tmain{flex:1;padding:14px 10px 10px 12px;min-width:0}
.admit{font-family:'Special Elite',monospace;font-size:11px;letter-spacing:2px;color:var(--red)}
.show{font-family:'Abril Fatface',serif;font-size:22px;line-height:1.05;margin:4px 0 6px}
.meta{font-family:'Special Elite',monospace;font-size:12px;line-height:1.5}
.seat{font-size:21px;color:var(--red);margin-top:4px}
.stub{width:92px;flex:none;border-left:2px dashed var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.stub small{font-family:'Special Elite',monospace;font-size:10px;letter-spacing:1.5px}
.stub .name{font-size:24px;line-height:1}
.stamp{margin-top:6px;width:58px;height:58px;border-radius:50%;border:3px double var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Abril Fatface',serif;font-size:14px;transform:rotate(-16deg)}
.back{transform:rotateY(180deg);background-color:var(--paper);background-image:repeating-linear-gradient(transparent 0 27px,rgba(91,125,177,.28) 27px 28px);display:flex;align-items:center;padding:14px 20px;text-align:left;font-family:'Caveat',cursive;font-size:21px;line-height:28px;border-left:4px solid var(--pink)}
.flip-hint{font-size:20px;color:var(--red)}

.cd{display:flex;gap:8px;justify-content:center;margin-top:12px}
.cd div{position:relative;background:var(--ink);color:var(--cream);border-radius:8px;width:70px;padding:10px 0 8px}
.cd div::after{content:'';position:absolute;left:0;right:0;top:45%;height:1px;background:rgba(0,0,0,.6)}
.cd b{display:block;font-family:'Abril Fatface',serif;font-size:30px;font-weight:400}
.cd small{font-family:'Special Elite',monospace;font-size:11px;letter-spacing:1px}
.btn{display:inline-block;margin:14px 6px 0;padding:10px 14px;border:2px solid var(--ink);background:var(--cream);font-family:'Special Elite',monospace;font-size:14px;color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--red)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--red)}
.real{margin:40px auto 0;max-width:300px;background:#fff8c9;padding:18px;box-shadow:0 6px 14px rgba(58,26,20,.15);position:relative}
.real.pop{animation-name:popTilt2}
@keyframes popTilt2{to{opacity:1;transform:rotate(-2deg)}}
.real p{font-size:25px;line-height:1.2}
.sign{margin-top:36px;font-size:30px;color:var(--red)}
</style>
</head>
<body>
<div class="gingham"></div>
<main>
  <section id="intro">
    <p class="hand kicker">happy 24th, Agrim</p>
    <div class="cutout" id="title"></div>
    <div class="bag" id="bag">
      <div class="zip" id="zip"><div class="teeth"></div><div class="opened" id="opened"></div><div class="tab" id="tab" role="button" aria-label="Unzip the bag"></div></div>
      <div class="ghost gp"></div><div class="ghost gt gt1"></div><div class="ghost gt gt2"></div>
      <div class="label">contents:<br>1 birthday surprise<br><small>handle with love</small></div>
    </div>
    <p class="hint hand" id="hint">drag the zip to open →</p>
  </section>

  <section id="reveal" hidden>
    <div class="polaroid pop"><div class="tape"></div><img src="banner.JPG" alt="Samay Raina Live" id="banner"><p class="hand cap"><u>we're</u> going!!</p></div>
    <p class="sub pop">Samay Raina Live · IG Stadium, Delhi</p>

    <div class="section">
      <div class="cutout pop" id="t2"></div>
      <div id="tickets"></div>
      <p class="hand flip-hint pop">tap a ticket to flip it ↻</p>
    </div>

    <div class="section">
      <div class="cutout pop" id="t3"></div>
      <div class="cd pop" id="cd">
        <div><b id="cdD">0</b><small>DAYS</small></div>
        <div><b id="cdH">00</b><small>HRS</small></div>
        <div><b id="cdM">00</b><small>MIN</small></div>
        <div><b id="cdS">00</b><small>SEC</small></div>
      </div>
      <div class="pop">
        <a class="btn" id="calApple" download="samay-raina-live.ics">+ Apple / Outlook</a>
        <a class="btn" id="calGoogle" target="_blank" rel="noopener">+ Google Calendar</a>
      </div>
    </div>

    <div class="real pop" id="real"><div class="tape"></div><p class="hand">the real tickets?<br>look <b id="hintText"></b></p></div>
    <p class="sign hand pop">with love, Vanshita</p>
  </section>
</main>
<div class="gingham"></div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
/* ===== EDIT THESE ===== */
const CONFIG = {
  tickets: [
    { guest: "Agrim", no: "001", seat: "Seat: right next to me",
      note: "Happy 24th, my favourite person. You make me laugh every single day, so this time someone else gets a turn. Just for two hours. Then you're back on duty. — V" },
    { guest: "Vanshita", no: "002", seat: "Seat: right next to you",
      note: "Plus one: me. Non-transferable, non-refundable, and already planning what to wear. — V" }
  ],
  realTicketsHint: "" /* e.g. "inside your favourite hoodie". Leave "" to hide that note */
};
/* ====================== */

const SHOW_UTC = Date.UTC(2027, 2, 27, 9, 30, 0); /* 27 Mar 2027, 3:00 PM IST */
const PAL = [["#8b1e1e","#f4ecdc"],["#e9a6b8","#3a1a14"],["#f2c94c","#3a1a14"],["#3a1a14","#f4ecdc"],["#f4ecdc","#8b1e1e"],["#6b8f71","#fbf6ea"],["#5b7db1","#fbf6ea"],["#d9822b","#fbf6ea"]];
const FONTS = ["'Abril Fatface',serif","'Playfair Display',serif","'Special Elite',monospace","'Caveat',cursive"];

function cutout(el, text, size){
  let last = -1;
  text.split(" ").forEach(w => {
    const word = document.createElement("span"); word.className = "word";
    [...w].forEach(ch => {
      let i; do { i = Math.floor(Math.random()*PAL.length); } while (i === last); last = i;
      const s = document.createElement("span");
      s.textContent = ch;
      s.style.cssText = `background:${PAL[i][0]};color:${PAL[i][1]};font-family:${FONTS[Math.floor(Math.random()*FONTS.length)]};font-size:${size}px;transform:rotate(${(Math.random()*12-6).toFixed(1)}deg) translateY(${(Math.random()*4-2).toFixed(1)}px)`;
      word.appendChild(s);
    });
    el.appendChild(word);
  });
}
cutout(document.getElementById("title"), "birthday starter pack", 30);
cutout(document.getElementById("t2"), "your tickets", 24);
cutout(document.getElementById("t3"), "showtime in", 24);

document.getElementById("tickets").innerHTML = CONFIG.tickets.map((t, i) => `
  <div class="pop"><div class="ticket ${i ? "t-b" : "t-a"}"><div class="inner">
    <div class="face front">
      <div class="check"></div>
      <div class="tmain">
        <div class="admit">ADMIT ONE · GOLD</div>
        <div class="show">Samay Raina Live</div>
        <div class="meta">IG Stadium, New Delhi<br>Sat, 27 Mar 2027 · 3:00 PM</div>
        <div class="seat hand">${t.seat}</div>
      </div>
      <div class="stub"><small>GUEST</small><div class="name hand">${t.guest}</div><small>No. ${t.no}</small><div class="stamp">GOLD</div></div>
    </div>
    <div class="face back"><p>${t.note}</p></div>
  </div></div></div>`).join("");

document.querySelectorAll(".ticket").forEach(t => t.addEventListener("click", () => {
  t.classList.toggle("flipped");
  if (navigator.vibrate) navigator.vibrate(15);
}));

const bag = document.getElementById("bag"), zip = document.getElementById("zip"),
      tab = document.getElementById("tab"), opened = document.getElementById("opened"),
      hint = document.getElementById("hint"), reveal = document.getElementById("reveal");
let x = 0, startX = 0, dragging = false, done = false;
const maxX = () => zip.clientWidth - tab.offsetWidth;
function setX(v){
  x = Math.max(0, Math.min(v, maxX()));
  tab.style.transform = `translateX(${x}px)`;
  opened.style.width = (x + 18) + "px";
  if (x >= maxX() - 1) openBag();
}
tab.addEventListener("pointerdown", e => { e.stopPropagation(); dragging = true; startX = e.clientX - x; tab.setPointerCapture(e.pointerId); });
tab.addEventListener("pointermove", e => { if (dragging && !done) setX(e.clientX - startX); });
tab.addEventListener("pointerup", () => { dragging = false; });
bag.addEventListener("click", e => { if (e.target !== tab && !done) autoZip(); });
function autoZip(){
  const from = x, t0 = performance.now();
  (function step(t){
    const p = Math.min((t - t0) / 700, 1);
    setX(from + (maxX() - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1 && !done) requestAnimationFrame(step);
  })(t0);
}

function burst(){
  if (!window.confetti) return;
  const colors = ["#8b1e1e","#e9a6b8","#f2c94c","#f4ecdc","#b8892a","#b3202a"];
  let shapes = ["square","circle"];
  try { shapes.push(confetti.shapeFromText({ text: "♥", scalar: 2, color: "#b3202a" })); } catch(e) {}
  confetti({ particleCount: 140, spread: 90, origin: { y: .55 }, colors, shapes, scalar: 1.2 });
  setTimeout(() => {
    confetti({ particleCount: 80, angle: 60, spread: 60, origin: { x: 0, y: .75 }, colors, shapes, scalar: 1.2 });
    confetti({ particleCount: 80, angle: 120, spread: 60, origin: { x: 1, y: .75 }, colors, shapes, scalar: 1.2 });
  }, 350);
}

function openBag(){
  if (done) return; done = true;
  if (navigator.vibrate) navigator.vibrate([30, 40, 70]);
  bag.classList.add("gone"); hint.style.visibility = "hidden";
  burst();
  setTimeout(() => {
    bag.style.display = "none"; hint.style.display = "none";
    reveal.hidden = false;
    reveal.querySelectorAll(".pop").forEach((el, i) => el.style.animationDelay = (i * 0.22) + "s");
  }, 650);
}

const banner = document.getElementById("banner");
banner.onerror = () => {
  const d = document.createElement("div");
  d.textContent = "banner.jpg goes here";
  d.style.cssText = "padding:90px 10px;background:#1d2b3a;color:#fff;font-family:'Special Elite',monospace";
  banner.replaceWith(d);
};

function pad(n){ return String(n).padStart(2, "0"); }
function tick(){
  const d = SHOW_UTC - Date.now();
  if (d <= 0) { document.getElementById("cd").innerHTML = '<p class="hand" style="font-size:32px;color:#8b1e1e">it\'s showtime!!</p>'; return; }
  document.getElementById("cdD").textContent = Math.floor(d / 864e5);
  document.getElementById("cdH").textContent = pad(Math.floor(d / 36e5) % 24);
  document.getElementById("cdM").textContent = pad(Math.floor(d / 6e4) % 60);
  document.getElementById("cdS").textContent = pad(Math.floor(d / 1e3) % 60);
}
tick(); setInterval(tick, 1000);

const TITLE = "Samay Raina Live with Vanshita";
const LOC = "IG Stadium, New Delhi";
const DESC = "Gold tickets. Free seating, so we're leaving early!";
const ics = [
  "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Birthday Starter Pack//EN","BEGIN:VEVENT",
  "UID:samay-raina-live-agrim-2027@starterpack","DTSTAMP:20261114T000000Z",
  "DTSTART:20270327T093000Z","DTEND:20270327T113000Z",
  "SUMMARY:" + TITLE, "LOCATION:IG Stadium\\, New Delhi",
  "DESCRIPTION:Gold tickets. Free seating\\, so we're leaving early!",
  "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Samay Raina Live is tomorrow!","END:VALARM",
  "END:VEVENT","END:VCALENDAR"
].join("\r\n");
document.getElementById("calApple").href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
document.getElementById("calGoogle").href = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(TITLE) + "&dates=20270327T093000Z/20270327T113000Z&location=" + encodeURIComponent(LOC) + "&details=" + encodeURIComponent(DESC);

const real = document.getElementById("real");
if (CONFIG.realTicketsHint) document.getElementById("hintText").textContent = CONFIG.realTicketsHint;
else real.remove();
</script>
</body>
</html>
