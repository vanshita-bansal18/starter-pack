<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You've got mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4e9cd;
    --paper-dark: #e8d6ad;
    --ink: #3b2f25;
    --faded: #7d6b55;
    --blue: #2f4fa0;
    --red: #b8372b;
    --pink: #e46a76;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 16px 48px;
    background: #d8c39a;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(110, 70, 25, .18), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(110, 70, 25, .2), transparent 45%);
    font-family: 'Special Elite', 'Courier New', monospace;
    color: var(--ink);
  }
  .screen { display: none; width: 100%; max-width: 440px; }
  .screen.active { display: block; animation: rise .8s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .sheet {
    background: var(--paper);
    background-image:
      radial-gradient(circle at 80% 12%, rgba(160, 110, 40, .16), transparent 22%),
      radial-gradient(circle at 12% 78%, rgba(160, 110, 40, .14), transparent 25%);
    padding: 10px;
    border-radius: 3px;
    box-shadow: 0 10px 30px rgba(60, 40, 15, .25);
  }
  .inner { position: relative; border: 3px dashed var(--blue); padding: 26px 20px; }

  .kicker { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--faded); }
  h1 { font-family: 'Caveat', cursive; font-size: 40px; font-weight: 700; margin: 6px 0 10px; line-height: 1.1; }
  .barcode {
    height: 34px; width: 70%;
    background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 13px);
  }
  .track-no { font-size: 13px; color: var(--faded); margin: 4px 0 24px; }
  .timeline { list-style: none; border-left: 2px dotted var(--faded); margin: 0 0 26px 8px; padding-left: 22px; }
  .timeline li { position: relative; margin-bottom: 20px; opacity: 0; animation: rise .6s ease forwards; }
  .timeline li::before {
    content: ''; position: absolute; left: -30px; top: 3px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--ink);
  }
  .timeline li.delayed::before { background: var(--pink); border-color: var(--red); }
  .timeline li.delivered::before { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 0 5px rgba(47, 79, 160, .18); }
  .step-title { font-size: 16px; }
  .step-detail { font-size: 13px; color: var(--faded); margin-top: 3px; }
  .ticket {
    display: inline-block; margin-left: 8px; padding: 3px 9px;
    background: var(--pink); color: #3a1414; font-size: 11px; letter-spacing: 1px;
    border-radius: 3px; outline: 1px dashed rgba(58, 20, 20, .5); outline-offset: -4px;
    transform: rotate(-4deg);
  }
  .btn {
    display: block; width: 100%;
    font-family: 'Special Elite', monospace; font-size: 17px;
    color: var(--paper); background: var(--ink);
    border: none; border-radius: 4px; padding: 14px;
    cursor: pointer; opacity: 0; animation: rise .6s ease forwards;
  }

  .stage { padding-top: 46%; }
  .envelope { position: relative; width: 100%; aspect-ratio: 3 / 2; cursor: pointer; perspective: 900px; }
  .env-back { position: absolute; inset: 0; background: #d9c08f; border-radius: 4px; box-shadow: 0 10px 30px rgba(60, 40, 15, .3); }
  .peek {
    position: absolute; left: 7%; right: 7%; top: 6%; height: 86%; z-index: 2;
    background: var(--paper); border-radius: 2px;
    transition: transform .8s ease .55s;
  }
  .pocket {
    position: absolute; inset: 0; z-index: 3; background: var(--paper-dark);
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
  }
  .flap {
    position: absolute; left: 0; right: 0; top: 0; height: 62%; z-index: 4;
    background: #e2cb9c; clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .6s ease, z-index 0s linear .3s;
  }
  .seal {
    position: absolute; left: 50%; top: 62%; width: 58px; height: 58px; margin: -29px 0 0 -29px; z-index: 5;
    border-radius: 47% 53% 50% 50% / 52% 48% 52% 48%;
    background: var(--red); color: #f6d2c8;
    font-family: 'Caveat', cursive; font-size: 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 5px rgba(0, 0, 0, .12), 0 3px 6px rgba(0, 0, 0, .25);
    transition: opacity .3s, transform .3s;
  }
  .open .seal { opacity: 0; transform: scale(.6); }
  .open .flap { transform: rotateX(180deg); z-index: 1; }
  .open .peek { transform: translateY(-58%); }
  .hint { text-align: center; margin-top: 24px; font-family: 'Caveat', cursive; font-size: 26px; animation: bob 1.8s ease-in-out infinite; }

  .postmark {
    position: absolute; top: 16px; right: 16px; width: 78px; height: 78px;
    border: 2px solid rgba(184, 55, 43, .55); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 10px; line-height: 1.4; letter-spacing: 1px; color: rgba(184, 55, 43, .7);
    transform: rotate(-12deg);
  }
  .date { font-size: 13px; color: var(--faded); margin-bottom: 26px; }
  .greeting { font-size: 18px; margin-bottom: 16px; }
  .letter-body p { font-size: 16px; line-height: 1.85; margin-bottom: 16px; opacity: 0; animation: rise .7s ease forwards; }
  .after { opacity: 0; animation: rise .8s ease forwards; }
  .signoff { margin-top: 22px; font-size: 16px; }
  .name { font-family: 'Caveat', cursive; font-size: 34px; line-height: 1.1; }
  .ps { margin: 30px 0 18px; font-family: 'Caveat', cursive; font-size: 24px; }
  .btn-outline {
    display: block; width: 100%;
    font-family: 'Special Elite', monospace; font-size: 16px;
    color: var(--ink); background: transparent;
    border: 2px solid var(--ink); border-radius: 4px; padding: 12px;
    box-shadow: 0 3px 0 var(--ink); cursor: pointer;
  }
  .btn-outline:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

  .tape-wrap { padding: 36px 0 8px; filter: drop-shadow(0 14px 18px rgba(40, 25, 10, .4)); }
  #cassette { display: block; width: 100%; height: auto; }
  .deck { display: flex; align-items: center; gap: 14px; margin-top: 22px; }
  .play {
    flex: 1; font-family: 'Special Elite', monospace; font-size: 17px; padding: 13px;
    border: 2px solid var(--ink); background: var(--paper-dark); color: var(--ink);
    border-radius: 4px; cursor: pointer; box-shadow: 0 3px 0 var(--ink);
  }
  .play:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .counter { font-size: 18px; background: #2c2a29; color: #efe3c2; padding: 10px 12px; border-radius: 4px; letter-spacing: 2px; }
  .err { display: none; margin-top: 12px; font-size: 13px; color: var(--red); text-align: center; }
  .back {
    display: block; margin: 28px auto 0; background: none; border: none;
    font-family: 'Caveat', cursive; font-size: 22px; color: var(--ink);
    text-decoration: underline; cursor: pointer;
  }
</style>
</head>
<body>

<section id="trackScreen" class="screen active">
  <div class="sheet"><div class="inner">
    <p class="kicker">Parcel tracking</p>
    <h1>Your mail has arrived</h1>
    <div class="barcode"></div>
    <p class="track-no">Tracking no. <span id="trackNo"></span></p>
    <ol class="timeline" id="timeline"></ol>
    <button class="btn" id="openMail">Open your mail</button>
  </div></div>
</section>

<section id="envelopeScreen" class="screen">
  <div class="stage">
    <div class="envelope" id="envelope" role="button" aria-label="Open the envelope">
      <div class="env-back"></div>
      <div class="peek"></div>
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="seal">&#9829;&#xFE0E;</div>
    </div>
  </div>
  <p class="hint">Tap the seal to open</p>
</section>

<section id="letterScreen" class="screen">
  <div class="sheet"><div class="inner">
    <div class="postmark">NEW DELHI<br>2025</div>
    <p class="date" id="letterDate"></p>
    <p class="greeting" id="greeting"></p>
    <div class="letter-body" id="letterBody"></div>
    <div class="after" id="after">
      <p class="signoff" id="signoff"></p>
      <p class="name" id="name"></p>
      <p class="ps">P.S. Some things are better said out loud.</p>
      <button class="btn-outline" id="toTape">There's a tape in the envelope &rarr;</button>
    </div>
  </div></div>
</section>

<section id="tapeScreen" class="screen">
  <div class="tape-wrap">
    <svg id="cassette" viewBox="0 0 400 254" role="img" aria-label="A cassette tape labelled for Agrim">
      <defs>
        <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3b3937"/>
          <stop offset="1" stop-color="#222120"/>
        </linearGradient>
        <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2f2d2b"/>
          <stop offset="1" stop-color="#262423"/>
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
          <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
        </linearGradient>
        <clipPath id="win"><rect x="68" y="86" width="264" height="70" rx="8"/></clipPath>
      </defs>

      <rect x="2" y="2" width="396" height="250" rx="14" fill="url(#shell)" stroke="#0e0d0c" stroke-width="2"/>
      <rect x="9" y="9" width="382" height="236" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="40" y="2" width="16" height="7" fill="#121110"/>
      <rect x="344" y="2" width="16" height="7" fill="#121110"/>
      <rect x="26" y="20" width="348" height="156" rx="7" fill="url(#panel)" stroke="#000000" stroke-opacity=".45"/>

      <rect x="68" y="86" width="264" height="70" rx="8" fill="#14120f"/>
      <g clip-path="url(#win)">
        <circle id="packL" cx="115" cy="121" r="62" fill="#4b301e" stroke="#2c1b10" stroke-width="1"/>
        <circle id="packR" cx="285" cy="121" r="26" fill="#4b301e" stroke="#2c1b10" stroke-width="1"/>
      </g>
      <g id="hubs"></g>
      <rect x="68" y="86" width="264" height="70" rx="8" fill="url(#glass)" stroke="#000000" stroke-opacity=".6"/>

      <g transform="rotate(-2.5 200 52)">
        <polygon points="104,34 296,34 299,40 295,46 300,52 295,58 299,64 296,70 104,70 101,64 105,58 100,52 104,46 100,40" fill="#ece0bd" opacity=".96"/>
        <text x="200" y="61" text-anchor="middle" font-family="'Permanent Marker', cursive" font-size="26" fill="#2a2522">for Agrim</text>
      </g>

      <path d="M108 252 L126 190 L274 190 L292 252 Z" fill="#2d2b29" stroke="#000000" stroke-opacity=".5"/>
      <circle cx="148" cy="226" r="6" fill="#0f0e0d"/>
      <circle cx="252" cy="226" r="6" fill="#0f0e0d"/>
      <rect x="120" y="228" width="9" height="9" fill="#0f0e0d"/>
      <rect x="271" y="228" width="9" height="9" fill="#0f0e0d"/>
      <rect x="134" y="242" width="16" height="10" fill="#0f0e0d"/>
      <rect x="250" y="242" width="16" height="10" fill="#0f0e0d"/>
      <rect x="180" y="238" width="40" height="14" fill="#0f0e0d"/>
      <rect x="193" y="241" width="14" height="5" fill="#a08f74"/>
      <g id="screws"></g>
    </svg>
  </div>
  <div class="deck">
    <button class="play" id="playBtn"></button>
    <span class="counter" id="counter">00:00</span>
  </div>
  <p class="err" id="err">Recording not found. Check the file name in the code.</p>
  <button class="back" id="backBtn">&larr; Back to the letter</button>
  <audio id="voice" preload="metadata"></audio>
</section>

<script>
const CONFIG = {
  trackingNo: "8901188 222159",
  steps: [
    { title: "Dispatched", detail: "New Delhi · 22 Nov 2025", type: "done" },
    { title: "Held up in transit", detail: "Unforeseen circumstances", type: "delayed" },
    { title: "Out for delivery", detail: "Gurgaon · 22 Nov 2026", type: "done" },
    { title: "Delivered", detail: "Gurgaon · Today", type: "delivered" }
  ],
  letterDate: "22 November 2025",
  greeting: "Dear Agrim,",
  letter: `
Happiest birthday to you my love. I felt bad that we couldn’t celebrate your birthday last time and I didn’t give you your personalised gift last time hehe, so I thought I’ll mention it this time and make an extravagant gift this time. Hope you’re happy reading all the praise and things I have written about you. And I hope you loved the brownie, me and my mom baked for you. YES, you heard it right, I baked it (okay ig I contributed but still). ANYWAYS. 

I don’t want to repeat the things I’ve already mentioned ten times in my magazine and other places but I want to tell you that no matter how much I say I love you, I’ll always love you much more than that. I know we are not in the best place right now maybe, especially me and that scares me but just know that every part of me loves every piece of you. As long as I am alive, you will always have someone who is proud of you in everything that you do.

I know that most of these letters have the same kind of idea repeated in them, but there are a million different ways to say them. And I want to express all of them to you. I want to run out of paper before I run out of words to say to you. I want to grow old with you and die together like in the notebook (idk if you’ve watched it, but basically this couple gets old together and they die together in their sleep while holding hands) 

I won’t make it super long, so I’m just gonna say happy birthday. I love you.
`,
  signoff: "Yours always,",
  name: "Vanshita",
  audioFile: "voice.m4a"
};

const $ = id => document.getElementById(id);
const PLAY = "\u25B6\uFE0E Play";
const PAUSE = "\u275A\u275A Pause";

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

$('trackNo').textContent = CONFIG.trackingNo;
CONFIG.steps.forEach((step, i) => {
  const li = document.createElement('li');
  li.className = step.type;
  li.style.animationDelay = (0.4 + i * 0.7) + 's';
  const title = document.createElement('div');
  title.className = 'step-title';
  title.textContent = step.title;
  if (step.type === 'delayed') {
    const t = document.createElement('span');
    t.className = 'ticket';
    t.textContent = 'DELAYED';
    title.appendChild(t);
  }
  const detail = document.createElement('div');
  detail.className = 'step-detail';
  detail.textContent = step.detail;
  li.append(title, detail);
  $('timeline').appendChild(li);
});
$('openMail').style.animationDelay = (0.6 + CONFIG.steps.length * 0.7) + 's';
$('openMail').addEventListener('click', () => show('envelopeScreen'));

let opened = false;
$('envelope').addEventListener('click', () => {
  if (opened) return;
  opened = true;
  $('envelope').classList.add('open');
  setTimeout(() => { buildLetter(); show('letterScreen'); }, 1700);
});

function buildLetter() {
  $('letterDate').textContent = CONFIG.letterDate;
  $('greeting').textContent = CONFIG.greeting;
  const paras = CONFIG.letter.trim().split(/\n\s*\n/);
  paras.forEach((text, i) => {
    const p = document.createElement('p');
    p.textContent = text.trim();
    p.style.animationDelay = (0.5 + i * 0.5) + 's';
    $('letterBody').appendChild(p);
  });
  $('signoff').textContent = CONFIG.signoff;
  $('name').textContent = CONFIG.name;
  $('after').style.animationDelay = (0.8 + paras.length * 0.5) + 's';
}

$('toTape').addEventListener('click', () => show('tapeScreen'));
$('backBtn').addEventListener('click', () => show('letterScreen'));

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function makeHub(cx, cy) {
  const g = el('g', {}, $('hubs'));
  el('circle', { cx, cy, r: 20, fill: '#e6e2da', stroke: '#b5b0a6' }, g);
  el('circle', { cx, cy, r: 12, fill: '#1b1916' }, g);
  for (let k = 0; k < 6; k++) {
    el('rect', { x: cx - 2, y: cy - 12, width: 4, height: 5, fill: '#e6e2da', transform: `rotate(${k * 60} ${cx} ${cy})` }, g);
  }
  return g;
}
const hubL = makeHub(115, 121);
const hubR = makeHub(285, 121);

[[20, 20], [380, 20], [20, 234], [380, 234], [200, 210]].forEach(([x, y], i) => {
  const g = el('g', {}, $('screws'));
  el('circle', { cx: x, cy: y, r: 5.5, fill: '#8c8985', stroke: '#4b4946' }, g);
  const a = 20 + i * 35;
  el('line', { x1: x - 4, y1: y, x2: x + 4, y2: y, stroke: '#4b4946', 'stroke-width': 1.5, transform: `rotate(${a} ${x} ${y})` }, g);
  el('line', { x1: x, y1: y - 4, x2: x, y2: y + 4, stroke: '#4b4946', 'stroke-width': 1.5, transform: `rotate(${a} ${x} ${y})` }, g);
});

const audio = $('voice');
const playBtn = $('playBtn');
const packL = $('packL');
const packR = $('packR');
const R_MIN = 26, R_MAX = 62, TAPE_SPEED = 112;
let angL = 0, angR = 0, last = null, rafId = null;

audio.src = CONFIG.audioFile;
playBtn.textContent = PLAY;

function progress() {
  return audio.duration ? Math.min(audio.currentTime / audio.duration, 1) : 0;
}
function radii(p) {
  const a = R_MIN * R_MIN, b = R_MAX * R_MAX;
  return [Math.sqrt(a + (b - a) * (1 - p)), Math.sqrt(a + (b - a) * p)];
}
function draw() {
  const [rl, rr] = radii(progress());
  packL.setAttribute('r', rl.toFixed(1));
  packR.setAttribute('r', rr.toFixed(1));
  hubL.setAttribute('transform', `rotate(${angL.toFixed(1)} 115 121)`);
  hubR.setAttribute('transform', `rotate(${angR.toFixed(1)} 285 121)`);
}
function tick(t) {
  if (last !== null) {
    const dt = (t - last) / 1000;
    const [rl, rr] = radii(progress());
    angL -= (TAPE_SPEED / rl) * dt * 180 / Math.PI;
    angR -= (TAPE_SPEED / rr) * dt * 180 / Math.PI;
  }
  last = t;
  draw();
  rafId = requestAnimationFrame(tick);
}
function fmt(s) {
  s = Math.floor(s || 0);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

playBtn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play().catch(() => { $('err').style.display = 'block'; });
  } else {
    audio.pause();
  }
});
audio.addEventListener('play', () => {
  playBtn.textContent = PAUSE;
  last = null;
  if (!rafId) rafId = requestAnimationFrame(tick);
});
audio.addEventListener('pause', () => {
  playBtn.textContent = PLAY;
  cancelAnimationFrame(rafId);
  rafId = null;
  draw();
});
audio.addEventListener('ended', () => { playBtn.textContent = "\u25B6\uFE0E Play again"; });
audio.addEventListener('timeupdate', () => { $('counter').textContent = fmt(audio.currentTime); });
audio.addEventListener('loadedmetadata', draw);
audio.addEventListener('error', () => { $('err').style.display = 'block'; });
</script>
</body>
</html>
